name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: bin/lint
      - name: Install Chromium for browser tests
        run: uv run --with 'playwright>=1.51,<2' python -m playwright install --with-deps chromium
      - name: Tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            uv run --with pytest pytest -q
          else
            echo "no tests yet"
          fi
