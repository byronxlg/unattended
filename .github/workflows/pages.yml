name: Publish the blog
run-name: ${{ inputs.night_cycle || 'Publish the blog' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      night_cycle:
        description: Night publication correlation key
        required: false
        type: string
      code_sha:
        description: Trusted code commit for rollback (40 lowercase hex)
        required: false
        type: string
      data_sha:
        description: Data commit for rollback (40 lowercase hex)
        required: false
        type: string
  workflow_run:
    workflows: [NZ election hourly, NZ election daily]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  window:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: window
        env:
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: python3 product/nz_election/pipeline/sunsets.py pages
  build:
    needs: window
    if: >-
      needs.window.outputs.allowed == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve current publication guard
        run: cp product/nz_election/pipeline/deployment_guard.py "$RUNNER_TEMP/deployment_guard.py"
      - name: Check publication before rollback
        run: python3 "$RUNNER_TEMP/deployment_guard.py"
      - name: Validate rollback inputs
        env:
          CODE_SHA: ${{ inputs.code_sha }}
          DATA_SHA: ${{ inputs.data_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$CODE_SHA" "$DATA_SHA"; do
            if [[ -n "$sha" && ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Invalid rollback SHA' >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        if: inputs.code_sha != ''
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve data commit
        id: data
        env:
          DATA_SHA: ${{ inputs.data_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DATA_SHA" ]]; then
            sha="$DATA_SHA"
          else
            ref=$(git ls-remote origin refs/heads/data)
            sha=$(printf '%s' "$ref" | cut -f1)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.data.outputs.sha != ''
        with:
          ref: ${{ steps.data.outputs.sha }}
          path: _nz-election-data
          persist-credentials: false
      - name: Record actual checkouts
        env:
          DATA_SHA: ${{ steps.data.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "NZ_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -n "$DATA_SHA" ]]; then
            echo "NZ_DATA_SHA=$(git -C _nz-election-data rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - uses: astral-sh/setup-uv@v6
      - name: Check posts
        run: bin/blog check
      - name: Generate metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/metrics
      - name: Check publication before build
        run: python3 "$RUNNER_TEMP/deployment_guard.py"
      - name: Build election pages
        run: uv run product/nz_election/pipeline/build.py --data _nz-election-data/product/nz_election/data --out site/nz-election
      - name: Record build manifest
        run: |
          uv run python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from product.nz_election.pipeline import export
          root = Path('site/nz-election')
          manifest = json.loads((root / 'build-manifest.json').read_text())
          run = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          manifest.update(code_sha=os.environ['NZ_CODE_SHA'], run_url=run)
          manifest['data'].update(code_sha=os.environ['NZ_CODE_SHA'],
                                  data_sha=os.environ.get('NZ_DATA_SHA') or None,
                                  build_run_url=run, data_available=(root / 'data/polls.json').is_file())
          export.pair(root, 'build-manifest', manifest)
          PYTHON
      - name: Verify election pages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NZ_DATA_SHA:-}" ]]; then
            uv run product/nz_election/pipeline/verify.py all --data _nz-election-data/product/nz_election/data --site site
          else
            uv run product/nz_election/pipeline/verify.py all --site site
          fi
      - name: Install Chromium for route cards
        run: uv run --with 'playwright>=1.51,<2' python -m playwright install --with-deps chromium
      - name: Render route cards
        run: uv run product/nz_election/tests/screenshots.py --site site --out artifacts/nz-election/og --og-only
      - name: Require referenced route images
        run: |
          uv run python - <<'PYTHON'
          from pathlib import Path
          from product.nz_election.pipeline.route_checks import check_images
          check_images(Path('site/nz-election'))
          PYTHON
      - name: Build the site
        run: bin/blog build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Enforce election freeze at deployment time
        run: python3 product/nz_election/pipeline/deployment_guard.py
      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
