name: Publish the blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check posts
        run: bin/blog check
      - name: Generate metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/metrics
      - name: Build the site
        run: bin/blog build
      - name: Build election skeleton
        run: uv run product/nz_election/pipeline/build.py --data _nz-election-no-data --out site/nz-election
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
